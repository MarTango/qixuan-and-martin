<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qixuan &amp; Martin</title>
<style>
  :root { --bg: #faf8f5; --fg: #2b2623; --muted: #8a817a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161412; --fg: #f1ece6; --muted: #9a918a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; }
  header { text-align: center; padding: 4rem 1rem 2rem; }
  h1 { font-weight: normal; font-size: clamp(2rem, 6vw, 3.5rem); margin: 0; letter-spacing: .04em; }
  header p { color: var(--muted); margin: .5rem 0 0; font-style: italic; }
  #grid { columns: 3 260px; column-gap: 8px; padding: 8px; max-width: 1400px; margin: 0 auto; }
  #grid a { display: block; margin-bottom: 8px; background: var(--muted); }
  #grid img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  #lb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; }
  #lb.open { display: flex; }
  #lb img { max-width: 94vw; max-height: 94vh; }
  #lb button { position: absolute; background: none; border: 0; color: #fff; font-size: 2.5rem; cursor: pointer; padding: 1rem; }
  #prev { left: 0; } #next { right: 0; } #close { top: 0; right: 0; }
  footer { text-align: center; color: var(--muted); padding: 2rem 1rem; font-size: .85rem; }
</style>
</head>
<body>
<header>
  <h1>Qixuan &amp; Martin</h1>
  <p>Our wedding</p>
</header>
<main id="grid"></main>
<div id="lb" role="dialog" aria-modal="true">
  <button id="prev" aria-label="Previous">‹</button>
  <img alt="">
  <button id="next" aria-label="Next">›</button>
  <button id="close" aria-label="Close">×</button>
</div>
<footer>Click a photo to enlarge. Right-click or long-press to save.</footer>
<script>
const grid = document.getElementById("grid");
const lb = document.getElementById("lb");
const lbImg = lb.querySelector("img");
let photos = [], idx = 0;

function show(i) {
  idx = (i + photos.length) % photos.length;
  lbImg.src = photos[idx].full;
  lb.classList.add("open");
}
const hide = () => lb.classList.remove("open");

fetch("photos.json").then(r => r.json()).then(list => {
  photos = list;
  list.forEach((p, i) => {
    const a = document.createElement("a");
    a.href = p.full;
    const img = new Image();
    img.src = p.thumb; img.width = p.w; img.height = p.h;
    img.loading = "lazy"; img.alt = "";
    a.append(img);
    a.addEventListener("click", e => { e.preventDefault(); show(i); });
    grid.append(a);
  });
});

document.getElementById("prev").onclick = () => show(idx - 1);
document.getElementById("next").onclick = () => show(idx + 1);
document.getElementById("close").onclick = hide;
lb.addEventListener("click", e => { if (e.target === lb) hide(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") hide();
  if (e.key === "ArrowLeft") show(idx - 1);
  if (e.key === "ArrowRight") show(idx + 1);
});
</script>
</body>
</html>
